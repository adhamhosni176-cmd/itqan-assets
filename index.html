(function(){var A=null,D=null;

 if(d.itqan==='install'&&D){var p=D;D=null;p.prompt();p.userChoice.then(function(r){if(r&&r.outcome==='accepted')send({itqan:'installed'});else{D=p;}send({itqan:'canInstall',v:!!D});}).catch(function(){});}});
